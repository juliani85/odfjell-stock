name: Reporte de despachos con diferencia

on:
  workflow_dispatch:
    inputs:
      destinatarios:
        description: "Mails destinatarios (separados por coma)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enviar mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DESTINATARIOS: ${{ github.event.inputs.destinatarios }}
        run: python scripts/reporte_diferencias.py
