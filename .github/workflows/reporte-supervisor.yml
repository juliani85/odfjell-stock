name: Reporte para Supervisores

on:
  workflow_dispatch:
    inputs:
      destinatarios:
        description: "Mails destinatarios (separados por coma)"
        required: true
        type: string
      fecha:
        description: "Fecha del reporte en formato YYYY-MM-DD (vacío = hoy)"
        required: false
        type: string
      solicitudes:
        description: "N° de solicitudes (separados por ; )"
        required: false
        type: string
      guarda:
        description: "Agente girado — Guarda"
        required: false
        type: string
      medidor:
        description: "Agente girado — Medidor"
        required: false
        type: string
      jefeturno:
        description: "Agente girado — Jefe de turno"
        required: false
        type: string

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enviar reporte
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REP_SOLICITUDES: ${{ github.event.inputs.solicitudes }}
          REP_GUARDA: ${{ github.event.inputs.guarda }}
          REP_MEDIDOR: ${{ github.event.inputs.medidor }}
          REP_JEFETURNO: ${{ github.event.inputs.jefeturno }}
        run: |
          if [ -n "${{ github.event.inputs.fecha }}" ]; then
            python scripts/reporte_supervisor.py --destinatarios "${{ github.event.inputs.destinatarios }}" --fecha "${{ github.event.inputs.fecha }}"
          else
            python scripts/reporte_supervisor.py --destinatarios "${{ github.event.inputs.destinatarios }}"
          fi
